  short screen, scrolls inside its own frame instead. noindex on purpose.
-->

<title>Book a Call with JT | Sybago</title>

<link rel="icon" type="image/png" href="/apple-touch-icon.png">

html,body{height:100%;overflow:hidden;overscroll-behavior:none}

  display:flex;flex-direction:column;
  height:100vh;height:100dvh;
  background:#ffffff;color:#0f1419;
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;

}
h1{
  flex:none;
  max-width:640px;margin:0 auto;
  padding:clamp(16px,3vh,32px) 16px clamp(8px,1.5vh,16px);
  font-size:clamp(1rem,2.4vw,1.25rem);font-weight:600;line-height:1.45;text-align:center;
}
iframe{flex:1;min-height:0;width:100%;border:none;display:block}
</style>

<body>
<h1>Hey, this is JT. Book a call with me so I can walk you through how I can get your business more concrete estimates and how I've done so for others.</h1>
